<script>
document.addEventListener("DOMContentLoaded", () => {
  const city1 = document.getElementById("city1");
  const city2 = document.getElementById("city2");
  const schoolsList = document.getElementById("schools_list");

  // ※ 如果任一不存在，就不要往下做，避免 addEventListener 對 null
  if (!(city1 && city2 && schoolsList)) return;

  const regions = {
    1: ["臺北市","新北市","基隆市","桃園市","新竹市","新竹縣"],
    2: ["臺中市","彰化縣","南投縣","雲林縣","苗栗縣"],
    3: ["高雄市","臺南市","屏東縣","嘉義市","嘉義縣"],
    4: ["臺東縣","澎湖縣","宜蘭縣"]
  };

  city1.addEventListener("change", () => {
    const region = city1.value;
    city2.innerHTML = '<option value="">請選擇</option>';
    if (regions[region]) {
      regions[region].forEach(city => {
        const opt = document.createElement("option");
        opt.value = city;
        opt.textContent = city;
        city2.appendChild(opt);
      });
    }
  });

  city2.addEventListener("change", () => {
    const region = city1.value;
    const city = city2.value;
    if (!(region && city)) return;

    fetch("fetch_schools.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ region, city })
    })
    .then(r => r.json())
    .then(data => {
      schoolsList.innerHTML = data.map(school => `
        <div class="col-lg-4 col-md-6 col-xs-12 my-2">
          <div class="card text-center">
            <div class="card-body pt-3">
              <a href="schools_detail.php?psrid=${school.psrid}">
                <div class="img-container">
                  <img class="img-fluid" src="images/schools/cover/${school.school_img}" alt="圖片來源：${school.school_name}" />
                </div>
              </a>
            </div>
            <div class="card-footer">
              <p class="mt-3 card-title">
                <a href="schools_detail.php?psrid=${school.psrid}">
                  <i class="bi bi-play me-2"></i> ${school.school_name}
                </a>
              </p>
            </div>
          </div>
        </div>
      `).join("");
    })
    .catch(err => console.error("Error:", err));
  });
});
</script>
